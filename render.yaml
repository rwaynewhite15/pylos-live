# Render blueprint - free web service only.
# Reuses an existing free Postgres database (set DATABASE_URL manually in the
# Render dashboard after the service is created — see README/deploy notes).
# Tables are namespaced `pylos_*` so they coexist with other apps in the DB.

services:
  - type: web
    name: pylos-live
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL is intentionally NOT set here. Add it manually in the
      # service's Environment tab using the connection string from your
      # existing Render Postgres database (use the *Internal* URL).
